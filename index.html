<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3072 Dimensions: Organic VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; color: white;}
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #0a0815 0%, #000 100%); z-index: 100;
        }
        .upload-btn {
            position: relative; overflow: hidden; display: inline-block;
            padding: 20px 40px; background: linear-gradient(45deg, #00ffcc, #0066ff);
            color: white; font-size: 24px; font-weight: bold; border-radius: 50px;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
        }
        .upload-btn input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        #instructions { margin-top: 30px; text-align: center; line-height: 1.8; color: #ccc; }
        #loading { display: none; margin-top: 20px; font-size: 20px; color: #00ffcc; }
        
        #hud {
            position: absolute; top: 10px; width: 100%; text-align: center;
            pointer-events: none; z-index: 50; display: none; text-shadow: 0 0 5px #000; font-size: 16px; color: #ccc;
        }

        #control-panel {
            position: absolute; left: 20px; top: 20px; width: 340px; bottom: 20px;
            background: rgba(5, 10, 20, 0.8); border: 1px solid #00ffcc; border-radius: 10px;
            display: none; flex-direction: column; padding: 15px; box-sizing: border-box;
            z-index: 60; backdrop-filter: blur(5px);
        }
        #control-panel h2 { margin: 0 0 10px 0; font-size: 18px; color: #00ffcc; }
        #search-input {
            width: 100%; padding: 10px; border: none; border-radius: 5px; background: #fff;
            color: #000; margin-bottom: 10px; font-weight: bold; outline: none; box-sizing: border-box;
        }
        #entity-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        #entity-list li {
            padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer;
            transition: background 0.2s; display: flex; justify-content: space-between; font-size: 13px;
        }
        #entity-list li:hover { background: rgba(0, 255, 204, 0.2); }
        .selected-item { color: #fff; font-weight: bold; background: rgba(0, 255, 204, 0.35); border-left: 4px solid #00ffcc; }
        .badge { font-size: 11px; background: #333; padding: 2px 6px; border-radius: 10px; white-space: nowrap; margin-left: 5px;}
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-panel { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        #btn-clear { background: #555; }
        #btn-record { background: #ff4444; }
        .recording-active { background: #00ffcc !important; box-shadow: 0 0 15px #00ffcc; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Organic Dimensions: VR</h1>
        <div class="upload-btn">
            <span>MP3 오디오 선택 (생명체 활성화)</span>
            <input type="file" id="audioInput" accept="audio/*">
        </div>
        <div id="loading">유기체 데이터 맵핑 중...</div>
        <div id="instructions">
            <strong>[PC]</strong> 우클릭: 유기체 펼침/수축 | ESC: UI 숨김 | R: 녹화<br><br>
            <strong>[VR]</strong><br>
            오른쪽 트리거: 유기체 펼침/수축<br>
            왼쪽 X/Y 버튼: 제어 패널(UI) 토글<br>
            오른쪽 A/B 버튼: 시뮬레이션 녹화
        </div>
    </div>

    <div id="control-panel">
        <h2>차원 추적기 (유기체 다중 선택)</h2>
        <input type="text" id="search-input" placeholder="이름 검색 (예: 서울, 호랑이)">
        <ul id="entity-list"></ul>
        <div class="btn-group">
            <button id="btn-clear" class="btn-panel">선택 초기화</button>
            <button id="btn-record" class="btn-panel">⏺ 녹화 (R)</button>
        </div>
    </div>

    <div id="hud">PC: 우클릭(펼침), ESC(UI), R(녹화) | VR: R트리거(펼침), L컨트롤러 X(UI)</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let audioCtx, analyser, dataArray;
        let currentState = 'ORGANIC_FLOW'; 
        let mainGroup; 

        let particleSystem;
        let pPositions, originalParticlePos, pColors, pTargetPos, pOffsets;
        let entitiesData = [];
        let entityMappings = [];
        let TOTAL_PARTICLE_COUNT = 0;

        let selectedEntities = new Set();
        let uiVisible = true;
        
        let vrToggleBtnPressed = false;
        let vrRecordBtnPressed = false;
        let vrTriggerRightPressed = false;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        const clock = new THREE.Clock();

        async function loadEntitiesData() {
            try {
                const response = await fetch('./entities.json');
                if(!response.ok) throw new Error("JSON Not Found");
                entitiesData = await response.json();
            } catch (error) {
                entitiesData = [];
                for(let i=0; i<3072; i++) {
                    entitiesData.push({ name: `Node_${i+1}`, category: i % 2 === 0 ? "TypeA" : "TypeB" });
                }
            }

            entitiesData.sort(() => Math.random() - 0.5);

            let currentIndex = 0;
            entitiesData.forEach((entity, index) => {
                const weightOptions = [50, 60, 70, 80, 90, 100];
                const count = weightOptions[Math.floor(Math.random() * weightOptions.length)];
                
                const startIndex = currentIndex;
                const endIndex = currentIndex + count - 1;
                
                let color;
                if (entity.category === 'Positive' || entity.category === 'Europe & Turkey') {
                    const hue = Math.random() * 0.15 + (Math.random() > 0.5 ? 0.0 : 0.85); 
                    color = new THREE.Color().setHSL(hue, 0.9, 0.6);
                } else {
                    const hue = Math.random() * 0.3 + 0.5;
                    color = new THREE.Color().setHSL(hue, 0.7, 0.6);
                }

                entityMappings.push({
                    id: index, name: entity.name, startIndex, endIndex, count, color, 
                    angle: (index / entitiesData.length) * Math.PI * 2 
                });
                currentIndex += count;
            });
            TOTAL_PARTICLE_COUNT = currentIndex;
        }

        document.getElementById('audioInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading').style.display = 'block';
            await loadEntitiesData(); 
            
            const reader = new FileReader();
            reader.onload = function(e) { initAudio(e.target.result); };
            reader.readAsArrayBuffer(file);
        });

        function initAudio(arrayBuffer) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.decodeAudioData(arrayBuffer, function(buffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                source.loop = true;
                source.start(0);
                
                document.getElementById('ui').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('control-panel').style.display = 'flex'; 
                document.body.appendChild(VRButton.createButton(renderer));
                
                initUI(); 
                initThreeJS();
                animate();
            });
        }

        function initUI() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('btn-clear');
            const recordBtn = document.getElementById('btn-record');
            
            searchInput.addEventListener('input', (e) => renderList(e.target.value));
            clearBtn.addEventListener('click', () => {
                selectedEntities.clear(); renderList(searchInput.value); updateParticleColors();
            });
            recordBtn.addEventListener('click', toggleRecording);
            renderList();
        }

        function renderList(filter = '') {
            const list = document.getElementById('entity-list');
            list.innerHTML = '';
            
            const lowerFilter = filter.toLowerCase();
            const filtered = entityMappings.filter(e => e.name.toLowerCase().includes(lowerFilter)).slice(0, 100);
            
            filtered.forEach(entity => {
                const li = document.createElement('li');
                const colorHex = (entity.category === 'Positive' || entity.category === 'Europe & Turkey') ? '#ff99cc' : '#99ccff';
                li.innerHTML = `<span style="color:${colorHex}">${entity.name}</span> <span class="badge">${entity.count} 입자</span>`;
                
                if (selectedEntities.has(entity.id)) li.classList.add('selected-item');
                li.addEventListener('click', () => {
                    selectedEntities.has(entity.id) ? selectedEntities.delete(entity.id) : selectedEntities.add(entity.id);
                    renderList(filter); updateParticleColors(); 
                });
                list.appendChild(li);
            });
        }

        function updateParticleColors() {
            if (!particleSystem) return;
            const isSelectMode = selectedEntities.size > 0;

            for (let i = 0; i < entityMappings.length; i++) {
                const entity = entityMappings[i];
                const isSelected = selectedEntities.has(entity.id);
                let r, g, b;
                
                if (!isSelectMode) { 
                    r = entity.color.r; g = entity.color.g; b = entity.color.b; 
                } else if (isSelected) { 
                    r = entity.color.r * 2.0; g = entity.color.g * 2.0; b = entity.color.b * 2.0; 
                } else { 
                    r = 0.01; g = 0.01; b = 0.03; 
                }

                for (let p = entity.startIndex; p <= entity.endIndex; p++) {
                    pColors[p * 3] = r; pColors[p * 3 + 1] = g; pColors[p * 3 + 2] = b;
                }
            }
            particleSystem.geometry.attributes.color.needsUpdate = true;
        }

        function toggleRecording() {
            const recordBtn = document.getElementById('btn-record');
            if (isRecording) {
                if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = '⏺ 녹화 (R)';
                recordBtn.classList.remove('recording-active');
            } else {
                try {
                    recordedChunks = [];
                    const stream = renderer.domElement.captureStream(30);
                    let mimeType = 'video/webm;codecs=vp9';
                    if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';

                    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                        const blob = new Blob(recordedChunks, { type: mimeType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = `Organic_3072D_Record.${ext}`;
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = '⏹ 저장 중지';
                    recordBtn.classList.add('recording-active');
                } catch (e) { console.warn("녹화 미지원 브라우저입니다."); }
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010205); 
            scene.fog = new THREE.FogExp2(0x010205, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 3); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const gridHelper = new THREE.GridHelper(30, 30, 0x00ffcc, 0x05101a);
            gridHelper.position.y = 0; 
            scene.add(gridHelper);

            renderer.xr.addEventListener('sessionstart', () => {
                document.getElementById('control-panel').style.display = 'none';
                document.getElementById('hud').style.display = 'none';
                controls.enabled = false; 
            });
            renderer.xr.addEventListener('sessionend', () => {
                document.getElementById('control-panel').style.display = uiVisible ? 'flex' : 'none';
                document.getElementById('hud').style.display = 'block';
                controls.enabled = true; 
            });

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.5, -3);
            controls.enableDamping = true;

            mainGroup = new THREE.Group();
            scene.add(mainGroup);
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));

            createParticles(); 

            window.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleForm(); });
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                if (document.activeElement.id === 'search-input' && e.key !== 'Escape') return;
                const panel = document.getElementById('control-panel');
                if (e.key === 'Escape') { uiVisible = false; document.activeElement.blur(); } 
                else if (e.key === 'r' || e.key === 'R') { toggleRecording(); } 
                else { uiVisible = true; }
                if (!renderer.xr.isPresenting) panel.style.display = uiVisible ? 'flex' : 'none';
            });
        }

        function createParticles() {
            const geo = new THREE.BufferGeometry();
            pPositions = new Float32Array(TOTAL_PARTICLE_COUNT * 3);
            pTargetPos = new Float32Array(TOTAL_PARTICLE_COUNT * 3);
            originalParticlePos = new Float32Array(TOTAL_PARTICLE_COUNT * 3);
            pColors = new Float32Array(TOTAL_PARTICLE_COUNT * 3); 
            pOffsets = new Float32Array(TOTAL_PARTICLE_COUNT); 
            
            for (let i = 0; i < entityMappings.length; i++) {
                const entity = entityMappings[i];
                for (let p = entity.startIndex; p <= entity.endIndex; p++) {
                    const idx = p * 3;
                    
                    const radius = Math.random() * 0.5;
                    const theta = Math.random() * Math.PI * 2;
                    const yOffset = (Math.random() - 0.5) * 1.5;
                    
                    originalParticlePos[idx] = Math.cos(theta) * radius;
                    originalParticlePos[idx+1] = yOffset;
                    originalParticlePos[idx+2] = Math.sin(theta) * radius;
                    
                    pPositions[idx] = originalParticlePos[idx];
                    pPositions[idx+1] = originalParticlePos[idx+1] + 1.5;
                    pPositions[idx+2] = originalParticlePos[idx+2] - 3.0;

                    pTargetPos[idx] = pPositions[idx];
                    pTargetPos[idx+1] = pPositions[idx+1];
                    pTargetPos[idx+2] = pPositions[idx+2];
                    
                    pOffsets[p] = Math.random() * Math.PI * 2;
                }
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(pColors, 3)); 
            
            geo.computeBoundingSphere();
            geo.computeBoundingBox();

            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.beginPath(); ctx.arc(16, 16, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff'; ctx.fill();
            
            const mat = new THREE.PointsMaterial({
                size: 0.04, map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.8,
                blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true 
            });

            particleSystem = new THREE.Points(geo, mat);
            particleSystem.frustumCulled = false; 
            mainGroup.add(particleSystem); 
            updateParticleColors(); 
        }

        function toggleForm() {
            currentState = (currentState === 'ORGANIC_FLOW') ? 'CORE_GATHER' : 'ORGANIC_FLOW';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() { renderer.setAnimationLoop(render); }

        function render() {
            let delta = clock.getDelta();
            if (delta > 0.05) delta = 0.016; 
            const time = clock.getElapsedTime();

            if (!renderer.xr.isPresenting && controls.enabled) controls.update();

            try {
                const session = renderer.xr.getSession();
                if (session) {
                    let leftXBPressed = false, rightABPressed = false, rightTrigger = false;

                    for (const source of session.inputSources) {
                        if (!source.gamepad || !source.gamepad.buttons) continue;
                        const btns = source.gamepad.buttons;
                        const btn4Pressed = (btns.length > 4 && btns[4].pressed);
                        const btn5Pressed = (btns.length > 5 && btns[5].pressed);
                        const triggerPressed = (btns.length > 0 && btns[0].value > 0.5);

                        if (source.handedness === 'left' && (btn4Pressed || btn5Pressed)) leftXBPressed = true;
                        if (source.handedness === 'right') {
                            if (btn4Pressed || btn5Pressed) rightABPressed = true;
                            if (triggerPressed) rightTrigger = true;
                        }
                    }

                    if (leftXBPressed && !vrToggleBtnPressed) {
                        uiVisible = !uiVisible; vrToggleBtnPressed = true;
                    } else if (!leftXBPressed) { vrToggleBtnPressed = false; }

                    if (rightABPressed && !vrRecordBtnPressed) {
                        toggleRecording(); vrRecordBtnPressed = true;
                    } else if (!rightABPressed) { vrRecordBtnPressed = false; }

                    if (rightTrigger && !vrTriggerRightPressed) {
                        toggleForm(); vrTriggerRightPressed = true;
                    } else if (!rightTrigger) { vrTriggerRightPressed = false; }
                }
            } catch (err) { console.warn("VR Input Warning", err); }

            let audioIntensity = 0;
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<30; i++) sum += dataArray[i]; 
                audioIntensity = sum / (30 * 255);
            }

            const isFlowing = (currentState === 'ORGANIC_FLOW');
            const centerBase = new THREE.Vector3(0, 1.5 + Math.sin(time) * 0.3, -3);

            for (let i = 0; i < entityMappings.length; i++) {
                const entity = entityMappings[i];
                const isSelected = selectedEntities.has(entity.id);
                
                const pulsation = Math.sin(time * 2.0 + entity.angle) * 0.5 + 1.0;
                const bloomRadius = isFlowing ? 3.0 + audioIntensity * 2.0 : 0.5;
                
                const armX = Math.cos(entity.angle + time * 0.2) * bloomRadius;
                const armZ = Math.sin(entity.angle + time * 0.2) * bloomRadius;

                for (let p = entity.startIndex; p <= entity.endIndex; p++) {
                    const idx = p * 3;
                    const pOffset = pOffsets[p];
                    
                    const origX = originalParticlePos[idx];
                    const origY = originalParticlePos[idx+1];
                    const origZ = originalParticlePos[idx+2];

                    if (isFlowing) {
                        const wave = Math.sin(time * 3.0 - origY * 5.0 + pOffset) * 0.5;
                        pTargetPos[idx] = centerBase.x + armX + origX * pulsation + wave;
                        pTargetPos[idx+1] = centerBase.y + origY * 2.0 * pulsation;
                        pTargetPos[idx+2] = centerBase.z + armZ + origZ * pulsation + Math.cos(time * 3.0 + pOffset) * 0.5;
                        
                        if (isSelected) {
                            pTargetPos[idx+1] += Math.sin(time * 5.0) * 0.5;
                        }
                    } else {
                        pTargetPos[idx] = centerBase.x + origX * 0.5;
                        pTargetPos[idx+1] = centerBase.y + origY * 0.5;
                        pTargetPos[idx+2] = centerBase.z + origZ * 0.5;
                    }

                    pPositions[idx] += (pTargetPos[idx] - pPositions[idx]) * delta * (isSelected ? 5.0 : 2.0);
                    pPositions[idx+1] += (pTargetPos[idx+1] - pPositions[idx+1]) * delta * (isSelected ? 5.0 : 2.0);
                    pPositions[idx+2] += (pTargetPos[idx+2] - pPositions[idx+2]) * delta * (isSelected ? 5.0 : 2.0);
                }
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
